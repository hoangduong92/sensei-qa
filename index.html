<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ôn hỏi đáp</title>
<style>
:root { --bg: #F5F6F9; --surface: #FFFFFF; --ink: #141D30; --mute: #5A6478; --line: #DCE1EA; --shu: #C8402A; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0F1729; --surface: #18223A; --ink: #E9EDF5; --mute: #9DA8BF; --line: #2E3A58; --shu: #E0563D; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 "Be Vietnam Pro", system-ui, sans-serif; }
form { width: min(380px, 100%); background: var(--surface); border-radius: 18px; padding: 28px 24px; box-shadow: 0 8px 24px rgba(20,29,48,.08); }
.seal { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--shu); color: var(--shu); display: grid; place-items: center; font-weight: 700; font-size: 1.3rem; transform: rotate(-12deg); margin-bottom: 14px; }
h1 { font-size: 1.3rem; margin: 0 0 4px; }
p { margin: 0 0 18px; color: var(--mute); font-size: .92rem; }
input { width: 100%; font: inherit; color: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
input:focus-visible, button:focus-visible { outline: 3px solid var(--shu); outline-offset: 2px; }
button { margin-top: 12px; width: 100%; font: inherit; font-weight: 600; padding: 12px; border: 0; border-radius: 12px; background: var(--ink); color: var(--surface); cursor: pointer; }
button:disabled { opacity: .6; }
.err { color: var(--shu); font-size: .9rem; margin: 10px 0 0; min-height: 1.4em; }
label.keep { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: .9rem; color: var(--mute); }
</style>
</head>
<body>
<form id="f">
  <div class="seal" aria-hidden="true">済</div>
  <h1>Ôn hỏi đáp Pitch Day</h1>
  <p>Trang dành cho đội Sensei Agent. Nhập mật khẩu để mở.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Mật khẩu" aria-label="Mật khẩu" required>
  <label class="keep"><input id="keep" type="checkbox" checked style="width:auto"> Nhớ mật khẩu trên máy này</label>
  <button id="go" type="submit">Mở trang</button>
  <div class="err" id="err" role="alert"></div>
</form>

async function open(pw) {

  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: u8(P.s), iterations: P.n, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(P.i) }, key, u8(P.c)));
  document.open(); document.write(html); document.close();
}
const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
f.addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value.trim();
  go.disabled = true; go.textContent = "Đang mở…"; err.textContent = "";
  try {
    if (document.getElementById("keep").checked) { try { localStorage.setItem(KEY, pw); } catch {} }
    await open(pw);
  } catch {
    try { localStorage.removeItem(KEY); } catch {}
    err.textContent = "Mật khẩu chưa đúng. Kiểm tra chữ hoa, chữ thường rồi thử lại.";
    go.disabled = false; go.textContent = "Mở trang";
  }
});
(async () => {
  let saved = null; try { saved = localStorage.getItem(KEY); } catch {}
  if (saved) { try { await open(saved); } catch { try { localStorage.removeItem(KEY); } catch {} } }
})();
})();
</script>
